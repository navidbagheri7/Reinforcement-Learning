name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[deep,control,notebooks,dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python scripts/validate_release.py
      - run: decision-lab lectures --quick --output results/smoke/ci_lectures
      - run: decision-lab tabular --quick --output results/smoke/ci_tabular
      - run: python -m build
